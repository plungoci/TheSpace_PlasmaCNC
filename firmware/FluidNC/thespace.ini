; ---------------------------------------------------------------------------
; TheSpace PlasmaCNC build environments
; Kept in a separate file so upstream FluidNC files stay (almost) untouched.
; Included from platformio.ini -> extra_configs.
; Our code lives in FluidNC/src/TheSpace/ - a folder upstream does not have,
; so `git subtree pull` never conflicts with it, and every env compiles it.
; ---------------------------------------------------------------------------

; MKS LS ESP32 PRO V2.1 (ESP32-S3-WROOM-1U-N8), WiFi build.
[env:thespace_s3]
extends = env:wifi_s3

; PC simulator (Linux) - for testing without hardware.
[env:thespace_linux]
extends = env:linux_x86_64
